[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cabinet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9,<3",
    "pydantic>=2.14.4",
    "httpx>=0.27,<0.29",
    "typer>=0.29.2",
    "icalendar>=7.3.2,<8",
    "recurring-ical-events>=3.8.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.4",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
audio = ["mlx-whisper>=0.4.3"]
dev = ["pytest>=9.2.0", "ruff>=0.17.6"]

[project.scripts]
cabinet = "cabinet.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cabinet = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
