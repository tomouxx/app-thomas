# Règles de ruff pour les tests de contrat. Elles sont fixées ici pour que
# `ruff check .` juge ces fichiers de la même façon quels que soient les
# réglages que l'exécutant choisit dans `pyproject.toml`. Il ne peut pas
# modifier ce dossier, il ne doit donc pas pouvoir y être bloqué.
target-version = "py312"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
